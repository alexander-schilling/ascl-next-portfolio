services:
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SHOW_CONTENT_WARNINGS: ${NEXT_PUBLIC_SHOW_CONTENT_WARNINGS:-false}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      PORTFOLIO_API_BASE_URL: ${PORTFOLIO_API_BASE_URL:-}
      PORTFOLIO_CACHE_REVALIDATE_SECONDS: ${PORTFOLIO_CACHE_REVALIDATE_SECONDS:-300}
      NEXT_PUBLIC_SHOW_CONTENT_WARNINGS: ${NEXT_PUBLIC_SHOW_CONTENT_WARNINGS:-false}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped

